name: IBV-SM Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backtest and email report
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          echo "Repository files:"
          find . -path ./.git -prune -o -type f -print
          f=$(find . -name 'backtest.py' -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "backtest.py is not in the repository"; exit 1; fi
          echo "Running $f"
          PYTHONPATH="$GITHUB_WORKSPACE:$(dirname "$f")" python "$f"

      - name: Save report and trade list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibv-backtest
          path: |
            **/backtest_report.html
            **/backtest_trades.csv
          retention-days: 90

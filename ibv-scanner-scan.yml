name: IBV-SM Nightly Scan

on:
  schedule:
    # 22:30 UTC Mon–Fri = 2:30 PM Pacific in winter (3:30 PM in summer)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # adds a "Run workflow" button for manual runs

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner and email report
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scanner.py

      - name: Save results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibv-scan-results
          path: results.csv
          retention-days: 30
